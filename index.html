<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitored Screen</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .screen {
            width: 100%;
            height: 100%;
            background-color: transparent;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="screen">
        <img src="https://paulabadt.github.io/broken/" alt="Screen" class="screen-image" loading="lazy">
    </div>
    <script>
        const url = 'https://paulabadt.github.io/broken/';
        const screen = document.querySelector('.screen');
        const img = document.createElement('img');
        img.src = url;
        img.className = 'screen-image';
        img.loading = 'lazy'; // Add lazy loading to improve performance
        screen.appendChild(img);

        // Set a timer to close the screen after a specific duration
        setTimeout(() => {
            const screen = document.querySelector('.screen');
            screen.innerHTML = '';
        }, 10000); // 10 seconds

        // Request permission from the recipient's device to view their screen
        navigator.permissions.query({ name: 'screen-reader' }).then(result => {
            if (result.state === 'granted') {
                console.log('Screen reading permission granted');
            } else if (result.state === 'denied') {
                console.log('Screen reading permission denied');
            } else {
                console.log('Screen reading permission pending');
            }
        });

        // Add event listeners for screen interaction
        screen.addEventListener('mousemove', () => {
            console.log('Screen moved');
        });

        screen.addEventListener('resize', () => {
            console.log('Screen resized');
        });

        // Capture key presses
        document.addEventListener('keydown', (event) => {
            console.log(`Key pressed: ${event.key}`);
        });

        // Add more event listeners as needed
    </script>
</body>
</html>
